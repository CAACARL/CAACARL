```svg
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="180" viewBox="0 0 700 180">
  <style>
    text {
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 24px;
      text-anchor: middle;
    }

    .base {
      fill: #00ff88;
      animation: flicker 3s infinite;
    }

    .green {
      fill: #39ff14;
      animation: glitch-left 2.5s infinite linear alternate-reverse;
    }

    .cyan {
      fill: #00f5ff;
      animation: glitch-right 2s infinite linear alternate-reverse;
    }

    @keyframes glitch-left {
      0%, 85%, 100% {
        clip-path: inset(0 0 0 0);
        transform: translate(0);
      }

      86% {
        clip-path: inset(10% 0 65% 0);
        transform: translate(-4px, -1px);
      }

      88% {
        clip-path: inset(55% 0 20% 0);
        transform: translate(4px, 1px);
      }

      90% {
        clip-path: inset(30% 0 45% 0);
        transform: translate(-2px);
      }

      92%, 100% {
        clip-path: inset(0 0 0 0);
        transform: translate(0);
      }
    }

    @keyframes glitch-right {
      0%, 80%, 100% {
        clip-path: inset(0 0 0 0);
        transform: translate(0);
      }

      81% {
        clip-path: inset(65% 0 10% 0);
        transform: translate(4px, 1px);
      }

      83% {
        clip-path: inset(15% 0 55% 0);
        transform: translate(-4px, -1px);
      }

      85% {
        clip-path: inset(45% 0 30% 0);
        transform: translate(2px);
      }

      87%, 100% {
        clip-path: inset(0 0 0 0);
        transform: translate(0);
      }
    }

    @keyframes flicker {
      0%, 90%, 100% { opacity: 1; }
      91% { opacity: 0.8; }
      92% { opacity: 1; }
      93% { opacity: 0.6; }
      94% { opacity: 1; }
    }
  </style>

  <g transform="translate(350 55)">
    <text class="base">&gt; Try not to croak...</text>
    <text class="green">&gt; Try not to croak...</text>
    <text class="cyan">&gt; Try not to croak...</text>
  </g>

  <g transform="translate(350 90)">
    <text class="base">[[ AND ]]</text>
    <text class="green">[[ AND ]]</text>
    <text class="cyan">[[ AND ]]</text>
  </g>

  <g transform="translate(350 125)">
    <text class="base">Always do your best! _//</text>
    <text class="green">Always do your best! _//</text>
    <text class="cyan">Always do your best! _//</text>
  </g>
</svg>
```